<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="HR Årshjul">
  <!-- ljus bakgrundsplatta så hjulet syns även mot mörka flikar -->
  <circle cx="16" cy="16" r="15.5" fill="#FAF8F4"/>
  <!-- däck (yttre ring) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#1A2332" stroke-width="2"/>
  <!-- fälg -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#B68B47" stroke-width="1.4"/>
  <!-- ekrar -->
  <g stroke="#6E7688" stroke-width="1" stroke-linecap="round">
    <line x1="16" y1="6"    x2="16" y2="26"/>
    <line x1="6"  y1="16"   x2="26" y2="16"/>
    <line x1="8.9" y1="8.9" x2="23.1" y2="23.1"/>
    <line x1="8.9" y1="23.1" x2="23.1" y2="8.9"/>
  </g>
  <!-- nav -->
  <circle cx="16" cy="16" r="1.9" fill="#1A2332"/>
</svg>
